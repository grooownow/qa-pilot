# On every push to main: publish a GitHub Release (and tag vX.Y.Z) for a new version in
# plugin.json, with its CHANGELOG section as notes. With no new version, fail when plugin
# files changed since the last release: users get updates only when the version changes.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Two quick pushes run one after the other, never racing to create the same release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run the plugin script tests
        run: python3 -m unittest discover -s scripts/plugin -p 'test_*.py'
      - name: Release the version in plugin.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 scripts/plugin/release.py version)
          if view=$(gh release view "v$version" 2>&1); then
            python3 scripts/plugin/release.py stale "v$version"
          elif ! grep -q "release not found" <<<"$view"; then
            echo "$view" >&2
            exit 1
          else
            python3 scripts/plugin/release.py notes > "$RUNNER_TEMP/notes.md"
            gh release create "v$version" --target "$GITHUB_SHA" --title "qa-pilot $version" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
